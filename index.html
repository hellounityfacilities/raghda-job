<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Al Raghda — Quote-to-Cash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Public+Sans:wght@400;600;700&family=Noto+Kufi+Arabic:wght@400;700&display=swap">
<style>
:root{--bg:#F3F2EE;--panel:#fff;--ink:#1B1F2A;--ink2:#5B6170;--line:#DDDCD6;--accent:#E0322B;--green:#1F7A45;--amber:#B8860B;--blue:#2C5F9E;--side:#1B1F2A}
*{box-sizing:border-box}
body{margin:0;font-family:'Public Sans',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
body[dir=rtl]{font-family:'Noto Kufi Arabic','Public Sans',sans-serif}
h1,h2,h3{font-family:'Oswald','Trebuchet MS',sans-serif;margin:0;font-weight:600}
body[dir=rtl] h1,body[dir=rtl] h2,body[dir=rtl] h3{font-family:'Noto Kufi Arabic',sans-serif}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--side);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;font-family:'Oswald',sans-serif;font-size:20px}
.logo i{width:14px;height:14px;background:var(--accent);border-radius:3px;display:inline-block}
.navbtn{background:none;border:0;color:#fff;opacity:.75;text-align:start;padding:10px 12px;border-radius:8px;font:inherit;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.navbtn:hover{opacity:1;background:#ffffff14}
.navbtn.active{opacity:1;background:var(--accent)}
.navbtn .badge{background:#ffffff33;border-radius:999px;padding:1px 8px;font-size:12px}
aside .spacer{flex:1}
.langbtn{border:1px solid #ffffff55;background:none;color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit}
main{padding:22px 28px;display:grid;gap:18px;align-content:start}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:28px}
.btn{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:#e9e8e3;color:var(--ink)}
.btn.primary{background:var(--accent);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;border-inline-start:5px solid var(--accent)}
.kpi .v{font-family:'Oswald',sans-serif;font-size:32px;line-height:1}
.kpi .l{color:var(--ink2);font-size:13px;margin-top:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h2{font-size:20px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;color:var(--ink2);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--line)}
body[dir=rtl] th{letter-spacing:0}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#faf9f5}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#e9e8e3}
.tag.new{background:#E3ECF7;color:var(--blue)}.tag.quoted,.tag.sent{background:#FBEFD2;color:#7A5300}.tag.won,.tag.approved,.tag.paid,.tag.delivered,.tag.closed{background:#DCEFE2;color:var(--green)}.tag.lost,.tag.rejected,.tag.overdue{background:#F9DCDA;color:var(--accent)}.tag.draft{background:#eee;color:#555}.tag.partial{background:#FBEFD2;color:#7A5300}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--ink2)}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:70px}
.modal-bg{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:22px;width:min(880px,100%);max-height:92vh;overflow:auto;display:grid;gap:14px}
.modal h2{font-size:22px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.right{margin-inline-start:auto}
.kanban{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:12px;overflow-x:auto}
.col{background:#EAE9E4;border-radius:12px;padding:10px;min-height:300px;display:grid;gap:8px;align-content:start}
.col h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);padding:4px 6px;display:flex;justify-content:space-between}
.card{background:#fff;border-radius:10px;padding:10px 12px;border:1px solid var(--line);cursor:pointer;display:grid;gap:4px;font-size:13px}
.card b{font-size:14px}
.card .m{color:var(--ink2)}
.card.late{border-inline-start:4px solid var(--accent)}
.lines td input,.lines td select{padding:6px 8px;font-size:13px}
.tot{display:grid;gap:4px;justify-items:end;font-size:15px}
.tot .big{font-family:'Oswald',sans-serif;font-size:26px}
.muted{color:var(--ink2);font-size:13px}
.searchbox{width:260px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.logo{width:100%}.two{grid-template-columns:1fr}main{padding:14px}}
@media print{aside,.topbar,.noprint{display:none!important}.app{display:block}main{padding:0}.panel{border:0}}
.doc{font-family:'Public Sans',sans-serif;display:grid;gap:14px}
.doc .head{display:flex;justify-content:space-between;border-bottom:3px solid var(--accent);padding-bottom:10px}
.doc h2{font-family:'Oswald',sans-serif;font-size:30px}
.toast{position:fixed;bottom:18px;inset-inline-start:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="logo"><i></i><span data-t="brand">Al Raghda</span></div>
  <div id="nav"></div>
  <div class="spacer"></div>
  <button class="langbtn" onclick="toggleLang()" id="langbtn">العربية</button>
  <p class="muted" style="color:#ffffff88;font-size:12px;margin:10px 4px 0" data-t="demo">Demo build — data saved in this browser</p>
</aside>
<main id="main"></main>
</div>
<div class="modal-bg" id="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

function lineTotal(l){const m=mat(l.mat);const area=(m.unit==='sqm')?(l.w*l.h||0):1;return m.rate*area*(l.qty||0)}
function quoteTotals(q){const sub=q.lines.reduce((a,l)=>a+lineTotal(l),0)+(+q.install||0);const disc=sub*(+q.discount||0)/100;const vat=(sub-disc)*(S.settings.vat||0)/100;return {sub,disc,vat,total:sub-disc+vat}}
function jobQuoteTotal(j){if(j.quote){const q=S.quotes.find(x=>x.id===j.quote);if(q)return quoteTotals(q).total}return j.total||0}
function jobCost(j){const mrate=S.machines[j.machine]||0;return (+j.mat||0)+(+j.machineHrs||0)*mrate+(+j.labourHrs||0)*(S.settings.labour||0)}
function invPaid(i){return i.payments.reduce((a,p)=>a+(+p.amount),0)}
function invTotal(i){if(i.total)return i.total;const j=S.jobs.find(x=>x.id===i.job);return j?jobQuoteTotal(j):0}
function invStatus(i){const p=invPaid(i),tt=invTotal(i);return p>=tt-0.5?'Paid':p>0?'Partial':'Unpaid'}

}

function ensureCustomer(){let cid=document.getElementById('f_cust').value;const n=document.getElementById('f_name').value.trim();if(!cid&&n){cid='c'+uid();S.customers.push({id:cid,name:n,company:document.getElementById('f_co').value.trim()||'—',phone:document.getElementById('f_ph').value.trim(),source:document.getElementById('f_src')?.value||'WhatsApp'})}return cid}
function saveEnquiry(id){const cid=ensureCustomer();if(!cid)return toast('Customer required');const o={id:id||'e'+uid(),date:today(),cust:cid,need:document.getElementById('f_need').value,deadline:document.getElementById('f_dl').value,status:document.getElementById('f_st').value,source:document.getElementById('f_src').value};
 if(id){Object.assign(S.enquiries.find(x=>x.id===id),o)}else S.enquiries.unshift(o);persist();closeModal();render();toast('✓')}

// ---------------------------------------------------------------- quotes
VIEWS.quotes=()=>`<div class="topbar"><h1>${t('quotes')}</h1><button class="btn primary" onclick="openQuote()">+ ${t('newQuote')}</button></div>

 ${S.quotes.sort((a,b)=>a.id<b.id?1:-1).map(q=>`<tr><td><b>${q.id}</b></td><td class="muted">${q.date}</td><td>${cust(q.cust).company}</td><td>${q.title}</td><td>${fmt(quoteTotals(q).total)}</td><td><span class="tag ${q.status.toLowerCase()}">${ts(q.status)}</span></td>
 <td class="row"><button class="btn sm" onclick="openQuote('${q.id}')">${t('viewQuote')}</button><button class="btn sm ghost" onclick="printQuote('${q.id}')">${t('print')}</button></td></tr>`).join('')}</table></div>`;
let Q; // working quote
function openQuote(id,enqId){
 Q=id?JSON.parse(JSON.stringify(S.quotes.find(x=>x.id===id))):{id:'Q-'+S.seq.q,date:today(),cust:enqId?S.enquiries.find(e=>e.id===enqId).cust:S.customers[0].id,enq:enqId||null,title:enqId?S.enquiries.find(e=>e.id===enqId).need:'',status:'Draft',discount:0,install:0,lines:[{mat:S.materials[0].id,desc:'',w:1,h:1,qty:1}],_new:!id};
 renderQuoteModal();
}
function renderQuoteModal(){
 const tt=quoteTotals(Q);
 modal(`<div class="row"><h2>${Q.id} · ${t('quoteFor')}</h2><span class="tag ${Q.status.toLowerCase()} right">${ts(Q.status)}</span></div>
 <div class="grid2"><label>${t('customer')}<select onchange="Q.cust=this.value">${custOptions(Q.cust)}</select></label><label>${t('title')}<input value="${esc(Q.title)}" oninput="Q.title=this.value"></label></div>
 <table class="lines"><tr><th style="width:24%">${t('material')}</th><th>${t('service')} / description</th><th>${t('width')}</th><th>${t('height')}</th><th>${t('qty')}</th><th>${t('rate')}</th><th>${t('line')}</th><th></th></tr>
 ${Q.lines.map((l,i)=>{const m=mat(l.mat);return `<tr><td><select onchange="Q.lines[${i}].mat=this.value;renderQuoteModal()">${S.materials.map(x=>`<option value="${x.id}" ${x.id===l.mat?'selected':''}>${x.name}</option>`).join('')}</select></td>
  <td><input value="${esc(l.desc)}" oninput="Q.lines[${i}].desc=this.value"></td>
  <td>${m.unit==='sqm'?`<input type="number" step="0.1" value="${l.w}" onchange="Q.lines[${i}].w=+this.value;renderQuoteModal()">`:'—'}</td><td>${m.unit==='sqm'?`<input type="number" step="0.1" value="${l.h}" onchange="Q.lines[${i}].h=+this.value;renderQuoteModal()">`:'—'}</td>
  <td><input type="number" value="${l.qty}" onchange="Q.lines[${i}].qty=+this.value;renderQuoteModal()"></td><td class="muted">${m.rate}/${m.unit}</td><td><b>${fmt(lineTotal(l))}</b></td><td><button class="btn sm ghost" onclick="Q.lines.splice(${i},1);renderQuoteModal()">×</button></td></tr>`}).join('')}</table>
 <div class="row"><button class="btn sm" onclick="Q.lines.push({mat:S.materials[0].id,desc:'',w:1,h:1,qty:1});renderQuoteModal()">+ ${t('addLine')}</button>
  <label class="right" style="width:160px">${t('installation')} (QAR)<input type="number" value="${Q.install}" onchange="Q.install=+this.value;renderQuoteModal()"></label>
  <label style="width:120px">${t('discount')} %<input type="number" value="${Q.discount}" onchange="Q.discount=+this.value;renderQuoteModal()"></label></div>
 <div class="tot"><span>${t('subtotal')}: ${fmt(tt.sub)}</span>${tt.disc?`<span>${t('discount')}: −${fmt(tt.disc)}</span>`:''}${S.settings.vat?`<span>${t('vat')} ${S.settings.vat}%: ${fmt(tt.vat)}</span>`:''}<span class="big">${t('total')}: ${fmt(tt.total)}</span></div>
 <div class="row"><button class="btn primary" onclick="saveQuote()">${t('save')}</button>
  ${Q.status==='Draft'?`<button class="btn" onclick="Q.status='Sent';saveQuote()">${t('markSent')}</button>`:''}
  ${['Draft','Sent'].includes(Q.status)?`<button class="btn green" onclick="approveQuote()">${t('approve')}</button><button class="btn ghost" onclick="Q.status='Rejected';saveQuote()">${t('reject')}</button>`:''}
  <button class="btn ghost" onclick="saveQuote(true);printQuote('${Q.id}')">${t('print')}</button>
  <a class="btn ghost" target="_blank" href="https://wa.me/${cust(Q.cust).phone.replace(/\D/g,'')}?text=${encodeURIComponent(`${S.settings.company} — ${Q.id}\n${Q.title}\n${Q.lines.map(l=>`• ${l.desc||mat(l.mat).name} ×${l.qty}: ${fmt(lineTotal(l))}`).join('\n')}\n${t('installation')}: ${fmt(Q.install)}\n${t('total')}: ${fmt(tt.total)}\n${t('validity')}`)}">${t('whatsapp')}</a>
  <button class="btn right" onclick="closeModal()">${t('cancel')}</button></div>`);
}
function saveQuote(keepOpen){const i=S.quotes.findIndex(x=>x.id===Q.id);const q=JSON.parse(JSON.stringify(Q));delete q._new;if(i>=0)S.quotes[i]=q;else{S.quotes.unshift(q);S.seq.q++;}
 if(q.enq){const e=S.enquiries.find(x=>x.id===q.enq);if(e&&e.status==='New')e.status='Quoted'}persist();if(!keepOpen){closeModal();render();toast('✓')}}
function approveQuote(){Q.status='Approved';saveQuote(true);const q=S.quotes.find(x=>x.id===Q.id);const m=mat(q.lines[0]?.mat).machine;
 const j={id:'J-'+S.seq.j,quote:q.id,cust:q.cust,title:q.title,stage:'Design',due:addDays(today(),10),assigned:'',machine:m,mat:0,machineHrs:0,labourHrs:0,notes:'',created:today()};S.seq.j++;S.jobs.unshift(j);
 if(q.enq){const e=S.enquiries.find(x=>x.id===q.enq);if(e)e.status='Won'}persist();closeModal();view='jobs';render();toast(j.id+' ✓')}
function printQuote(id){const q=S.quotes.find(x=>x.id===id);const tt=quoteTotals(q);const c=cust(q.cust);
 document.getElementById('main').innerHTML=docHtml(t('quoteFor'),q.id,q.date,c,q.lines.map(l=>[l.desc||mat(l.mat).name,mat(l.mat).unit==='sqm'?`${l.w}×${l.h} m`:'',l.qty,fmt(lineTotal(l))]),tt,q.install,t('validity'));
 setTimeout(()=>{window.print();render()},300)}
function docHtml(kind,ref,date,c,rows,tt,install,foot){return `<div class="panel doc"><div class="head"><div><h2>${S.settings.company}</h2><div class="muted">${S.settings.cr} · ${S.settings.phone}</div></div><div style="text-align:end"><h2>${kind}</h2><div>${ref}<br>${date}</div></div></div>
 <div><b>${c.name}</b><br>${c.company}<br>${c.phone}</div>
 <table><tr><th>Description</th><th>Size</th><th>${t('qty')}</th><th>${t('total')}</th></tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}${install?`<tr><td>${t('installation')}</td><td></td><td></td><td>${fmt(install)}</td></tr>`:''}</table>
 <div class="tot"><span>${t('subtotal')}: ${fmt(tt.sub)}</span>${tt.disc?`<span>${t('discount')}: −${fmt(tt.disc)}</span>`:''}${tt.vat?`<span>${t('vat')}: ${fmt(tt.vat)}</span>`:''}<span class="big">${t('total')}: ${fmt(tt.total)}</span></div><p class="muted">${foot}</p></div>`}

 <div class="kanban">${STAGES.map(s=>{const js=S.jobs.filter(j=>j.stage===s).sort((a,b)=>a.due<b.due?-1:1);return `<div class="col"><h3><span>${stageName(s)}</span><span>${js.length}</span></h3>

function openJob(id){const j=S.jobs.find(x=>x.id===id);const q=jobQuoteTotal(j),c=jobCost(j);const inv=S.invoices.find(i=>i.job===id);
 modal(`<div class="row"><h2>${j.id} · ${j.title}</h2><span class="tag right">${stageName(j.stage)}</span></div>
 <div class="grid2">
  <label>${t('stage')}<select onchange="S.jobs.find(x=>x.id==='${id}').stage=this.value;persist();openJob('${id}')">${STAGES.map(s=>`<option value="${s}" ${j.stage===s?'selected':''}>${stageName(s)}</option>`).join('')}</select></label>
  <label>${t('due')}<input type="date" value="${j.due}" onchange="S.jobs.find(x=>x.id==='${id}').due=this.value;persist()"></label>
  <label>${t('assigned')}<input value="${esc(j.assigned)}" onchange="S.jobs.find(x=>x.id==='${id}').assigned=this.value;persist()"></label>
  <label>${t('machine')}<select onchange="S.jobs.find(x=>x.id==='${id}').machine=this.value;persist();openJob('${id}')">${Object.keys(S.machines).map(m=>`<option ${j.machine===m?'selected':''}>${m}</option>`).join('')}</select></label>
  <label>${t('actualMat')}<input type="number" value="${j.mat}" onchange="S.jobs.find(x=>x.id==='${id}').mat=+this.value;persist();openJob('${id}')"></label>
  <label>${t('machineHrs')} (${S.machines[j.machine]||0}/h)<input type="number" step="0.5" value="${j.machineHrs}" onchange="S.jobs.find(x=>x.id==='${id}').machineHrs=+this.value;persist();openJob('${id}')"></label>
  <label>${t('labourHrs')} (${S.settings.labour}/h)<input type="number" step="0.5" value="${j.labourHrs}" onchange="S.jobs.find(x=>x.id==='${id}').labourHrs=+this.value;persist();openJob('${id}')"></label>
 </div>
 <label>${t('notes')}<textarea onchange="S.jobs.find(x=>x.id==='${id}').notes=this.value;persist()">${esc(j.notes)}</textarea></label>
 <div class="row"><b>${t('stockUsed')}:</b> ${S.movements.filter(v=>v.ref===id&&v.type==='consume').map(v=>`<span class="tag">${Math.abs(v.qty)} ${stockItem(v.item).unit} ${stockItem(v.item).name}</span>`).join(' ')||'<span class="muted">—</span>'}<button class="btn sm right" onclick="closeModal();openStockMove('consume',null,'${id}')">${t('useStock')}</button></div>
 <div class="kpis"><div class="kpi"><div class="v">${fmt(q)}</div><div class="l">${t('quoted')}</div></div><div class="kpi" style="border-color:var(--amber)"><div class="v">${fmt(c)}</div><div class="l">${t('cost')}</div></div><div class="kpi" style="border-color:var(--green)"><div class="v">${q?Math.round((q-c)/q*100):0}%</div><div class="l">${t('margin')} · ${fmt(q-c)}</div></div></div>
 <div class="row">${inv?`<button class="btn" onclick="openInvoice('${inv.id}')">${inv.id} · <span class="tag ${invStatus(inv).toLowerCase()}">${ts(invStatus(inv))}</span></button>`:`<button class="btn green" onclick="createInvoice('${id}')">${t('createInv')}</button>`}<button class="btn right" onclick="closeModal();render()">${t('cancel')}</button></div>`)}
function createInvoice(jobId){const j=S.jobs.find(x=>x.id===jobId);const inv={id:'INV-'+S.seq.i,date:today(),job:jobId,cust:j.cust,total:jobQuoteTotal(j),payments:[]};S.seq.i++;S.invoices.unshift(inv);persist();openInvoice(inv.id)}

VIEWS.invoices=()=>`<div class="topbar"><h1>${t('invoices')}</h1></div><div class="panel"><table><tr><th>${t('ref')}</th><th>${t('date')}</th><th>${t('customer')}</th><th>${t('jobs')}</th><th>${t('total')}</th><th>${t('paid')}</th><th>${t('balance')}</th><th>${t('status')}</th></tr>
 ${S.invoices.map(i=>{const tt=invTotal(i),p=invPaid(i);return `<tr style="cursor:pointer" onclick="openInvoice('${i.id}')"><td><b>${i.id}</b></td><td class="muted">${i.date}</td><td>${cust(i.cust).company}</td><td>${i.job}</td><td>${fmt(tt)}</td><td>${fmt(p)}</td><td><b>${fmt(tt-p)}</b></td><td><span class="tag ${invStatus(i).toLowerCase()}">${ts(invStatus(i))}</span></td></tr>`}).join('')}</table></div>`;
function openInvoice(id){const i=S.invoices.find(x=>x.id===id);const tt=invTotal(i),p=invPaid(i);
 modal(`<div class="row"><h2>${i.id} · ${t('invoiceDoc')}</h2><span class="tag right ${invStatus(i).toLowerCase()}">${ts(invStatus(i))}</span></div>
 <div class="kpis"><div class="kpi"><div class="v">${fmt(tt)}</div><div class="l">${t('total')}</div></div><div class="kpi" style="border-color:var(--green)"><div class="v">${fmt(p)}</div><div class="l">${t('paid')}</div></div><div class="kpi" style="border-color:var(--amber)"><div class="v">${fmt(tt-p)}</div><div class="l">${t('balance')}</div></div></div>
 <table><tr><th>${t('receiptNo')}</th><th>${t('date')}</th><th>${t('method')}</th><th>${t('amount')}</th><th></th></tr>${i.payments.map(x=>`<tr><td><b>${x.rcp||''}</b></td><td>${x.date}</td><td>${t(x.method)}</td><td>${fmt(x.amount)}</td><td><button class="btn sm ghost" onclick="printReceipt('${id}','${x.rcp}')">${t('print')}</button></td></tr>`).join('')||`<tr><td colspan=3 class="muted">${t('noData')}</td></tr>`}</table>
 ${tt-p>0.5?`<div class="row"><label>${t('amount')}<input type="number" id="p_amt" value="${Math.round(tt-p)}" style="width:140px"></label><label>${t('method')}<select id="p_m" style="width:150px"><option value="cash">${t('cash')}</option><option value="card">${t('card')}</option><option value="transfer">${t('transfer')}</option></select></label><button class="btn green" style="align-self:end" onclick="S.invoices.find(x=>x.id==='${id}').payments.push({date:today(),amount:+document.getElementById('p_amt').value,method:document.getElementById('p_m').value,rcp:'RCP-'+(S.seq.rcp++)});persist();openInvoice('${id}');toast('✓')">${t('recordPay')}</button></div>`:''}

function printInvoice(id){const i=S.invoices.find(x=>x.id===id);const j=S.jobs.find(x=>x.id===i.job);const q=j&&j.quote?S.quotes.find(x=>x.id===j.quote):null;const c=cust(i.cust);
 const rows=q?q.lines.map(l=>[l.desc||mat(l.mat).name,mat(l.mat).unit==='sqm'?`${l.w}×${l.h} m`:'',l.qty,fmt(lineTotal(l))]):[[j?j.title:i.job,'',1,fmt(invTotal(i))]];const tt=q?quoteTotals(q):{sub:invTotal(i),disc:0,vat:0,total:invTotal(i)};
 closeModal();document.getElementById('main').innerHTML=docHtml(t('invoiceDoc'),i.id,i.date,c,rows,tt,q?q.install:0,`${t('paid')}: ${fmt(invPaid(i))} · ${t('balance')}: ${fmt(invTotal(i)-invPaid(i))}. ${t('thanks')}`);setTimeout(()=>{window.print();render()},300)}

let invOnlyLow=false;
const stockItem=id=>S.stock.find(x=>x.id===id)||{name:'?',unit:'',cost:0};
VIEWS.inventory=()=>{const items=S.stock.filter(x=>!invOnlyLow||x.qty<=x.reorder);const low=S.stock.filter(x=>x.qty<=x.reorder).length;const val=S.stock.reduce((a,x)=>a+x.qty*x.cost,0);
 return `<div class="topbar"><h1>${t('inventory')}</h1><div class="row"><select style="width:auto" onchange="invOnlyLow=this.value==='1';render()"><option value="0" ${!invOnlyLow?'selected':''}>${t('allStock')}</option><option value="1" ${invOnlyLow?'selected':''}>${t('onlyLow')}</option></select><button class="btn" onclick="openStockMove('receive')">+ ${t('receive')}</button><button class="btn primary" onclick="openStockItem()">+ ${t('addStock')}</button></div></div>
 <div class="kpis"><div class="kpi"><div class="v">${S.stock.length}</div><div class="l">${t('materials')}</div></div><div class="kpi" style="border-color:${low?'var(--accent)':'var(--green)'}"><div class="v">${low}</div><div class="l">${t('lowStock')}</div></div><div class="kpi" style="border-color:var(--green)"><div class="v">${fmt(val)}</div><div class="l">${t('stockValue')}</div></div></div>
 <div class="panel"><table><tr><th>${t('material')}</th><th>${t('unit')}</th><th>${t('onHand')}</th><th>${t('reorderAt')}</th><th>${t('status')}</th><th>${t('unitCost')}</th><th>${t('stockValue')}</th><th>${t('supplier')}</th><th>${t('actions')}</th></tr>
 ${items.sort((a,b)=>(a.qty-a.reorder)-(b.qty-b.reorder)).map(x=>{const lowX=x.qty<=x.reorder;const pct=Math.min(100,Math.round(x.qty/Math.max(1,x.reorder*2)*100));return `<tr><td><b>${x.name}</b><div style="height:6px;background:#eee;border-radius:3px;margin-top:6px;width:180px"><div style="height:100%;width:${pct}%;background:${lowX?'var(--accent)':'var(--green)'};border-radius:3px"></div></div></td><td>${x.unit}</td><td><b style="font-size:18px">${x.qty}</b></td><td>${x.reorder}</td><td><span class="tag ${lowX?'overdue':'won'}">${lowX?t('low'):t('ok')}</span></td><td>${x.cost}</td><td>${fmt(x.qty*x.cost)}</td><td class="muted">${x.supplier}</td>
 <td class="row"><button class="btn sm green" onclick="openStockMove('receive','${x.id}')">+</button><button class="btn sm" onclick="openStockMove('adjust','${x.id}')">${t('adjust')}</button><button class="btn sm ghost" onclick="openStockItem('${x.id}')">✎</button></td></tr>`}).join('')||`<tr><td colspan=9 class="muted">${t('noData')}</td></tr>`}</table></div>
 <div class="panel"><h2>${t('movements')}</h2><table><tr><th>${t('date')}</th><th>${t('material')}</th><th>${t('type')}</th><th>${t('qtyChange')}</th><th>${t('ref')}</th><th>${t('reason')}</th></tr>
 ${S.movements.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,25).map(v=>`<tr><td class="muted">${v.date}</td><td>${stockItem(v.item).name}</td><td><span class="tag ${v.type==='receive'?'won':v.type==='consume'?'quoted':'draft'}">${t(v.type)}</span></td><td style="color:${v.qty<0?'var(--accent)':'var(--green)'}"><b>${v.qty>0?'+':''}${v.qty}</b></td><td>${v.ref||'—'}</td><td class="muted">${v.note||''}</td></tr>`).join('')}</table></div>`};
function openStockItem(id){const x=id?S.stock.find(y=>y.id===id):{name:'',unit:'sheet',qty:0,reorder:5,cost:0,supplier:''};
 modal(`<h2>${id?x.name:t('addStock')}</h2><div class="grid2"><label>${t('material')}<input id="s_n" value="${esc(x.name)}"></label><label>${t('unit')}<select id="s_u">${['sheet','roll','piece','set','kg','litre','m'].map(u=>`<option ${x.unit===u?'selected':''}>${u}</option>`).join('')}</select></label><label>${t('onHand')}<input type="number" id="s_q" value="${x.qty}"></label><label>${t('reorderAt')}<input type="number" id="s_r" value="${x.reorder}"></label><label>${t('unitCost')}<input type="number" step="0.5" id="s_c" value="${x.cost}"></label><label>${t('supplier')}<input id="s_s" value="${esc(x.supplier)}"></label></div>
 <div class="row"><button class="btn primary" onclick="saveStockItem('${id||''}')">${t('save')}</button><button class="btn" onclick="closeModal()">${t('cancel')}</button>${id?`<button class="btn ghost right" onclick="S.stock=S.stock.filter(y=>y.id!=='${id}');persist();closeModal();render()">${t('delete')}</button>`:''}</div>`)}
function saveStockItem(id){const v=k=>document.getElementById(k).value;const o={name:v('s_n'),unit:v('s_u'),qty:+v('s_q'),reorder:+v('s_r'),cost:+v('s_c'),supplier:v('s_s')};if(id)Object.assign(S.stock.find(y=>y.id===id),o);else S.stock.push({id:'s'+uid(),...o});persist();closeModal();render();toast('✓')}
function openStockMove(type,itemId,jobId){const isC=type==='consume';
 modal(`<h2>${t(type)}${jobId?' · '+jobId:''}</h2><div class="grid2"><label>${t('material')}<select id="v_i">${S.stock.map(x=>`<option value="${x.id}" ${x.id===itemId?'selected':''}>${x.name} (${x.qty} ${x.unit})</option>`).join('')}</select></label><label>${t('qtyChange')}<input type="number" step="0.5" id="v_q" value="1"></label>${type==='receive'?`<label>${t('ref')}<input id="v_r" value="PO-${S.seq.po}"></label>`:jobId?'':`<label>${t('ref')}<input id="v_r"></label>`}<label>${t('reason')}<input id="v_n"></label></div>
 <p class="muted">${type==='receive'?'Adds to stock on hand.':isC?'Deducts from stock and adds the material cost to the job.':'Positive or negative correction (count, damage, write-off).'}</p>
 <div class="row"><button class="btn primary" onclick="saveStockMove('${type}','${jobId||''}')">${isC?t('consumeBtn'):t('save')}</button><button class="btn" onclick="closeModal();${jobId?`openJob('${jobId}')`:''}">${t('cancel')}</button></div>`)}
function saveStockMove(type,jobId){const item=document.getElementById('v_i').value;let q=+document.getElementById('v_q').value;if(!q)return;if(type==='consume')q=-Math.abs(q);if(type==='receive')q=Math.abs(q);
 const x=S.stock.find(y=>y.id===item);x.qty=Math.max(0,Math.round((x.qty+q)*100)/100);const refEl=document.getElementById('v_r');const ref=jobId||(refEl?refEl.value:'');
 S.movements.push({id:'v'+uid(),date:today(),item,type,qty:q,ref,note:document.getElementById('v_n').value});if(type==='receive'){S.seq.po++;const sp=S.suppliers.find(y=>y.name===x.supplier)||S.suppliers[0];S.bills.push({id:'BILL-'+(S.seq.bill++),date:today(),due:addDays(today(),30),supplier:sp.id,ref,lines:[{acct:'1200',desc:`${q} ${x.unit} ${x.name}`,amount:Math.round(q*x.cost*100)/100}],vat:0,payments:[]})}
 if(jobId){const j=S.jobs.find(y=>y.id===jobId);j.mat=Math.round(((+j.mat||0)+Math.abs(q)*x.cost)*100)/100}persist();closeModal();toast('✓');if(jobId)openJob(jobId);else render()}


// ---------------------------------------------------------------- accounting engine (ledger derived from documents; manual entries stored)
const acct=c=>S.accounts.find(a=>a.code===c)||{code:c,name:'?',type:'asset'};
const SALES_ACCT={Laser:'4020',CNC:'4000','UV printer':'4010','Digital print':'4010'};
const payAcct=m=>m==='cash'?'1000':'1010';
const billPaid=b=>b.payments.reduce((a,p)=>a+ +p.amount,0);const billTotal=b=>b.lines.reduce((a,l)=>a+ +l.amount,0)+(+b.vat||0);const billBal=b=>billTotal(b)-billPaid(b);
const supplier=id=>S.suppliers.find(x=>x.id===id)||{name:'?'};
function allJournals(){const J=[];
 J.push({id:'OPEN',date:S.opening.date,ref:'Opening',memo:'Opening balances',lines:S.opening.lines});
 S.invoices.forEach(i=>{const tt=invTotal(i);if(!tt)return;const j=S.jobs.find(x=>x.id===i.job);const q=j&&j.quote?S.quotes.find(x=>x.id===j.quote):null;const vat=q?quoteTotals(q).vat:0;const net=tt-vat;const inst=q?Math.min(+q.install||0,net):0;
  const lines=[{acct:'1100',dr:tt,cr:0},{acct:SALES_ACCT[j?j.machine:'']||'4000',dr:0,cr:net-inst}];if(inst)lines.push({acct:'4040',dr:0,cr:inst});if(vat)lines.push({acct:'2100',dr:0,cr:vat});
  J.push({id:i.id,date:i.date,ref:i.id,memo:`Invoice ${cust(i.cust).company}`,lines,src:'invoice'});
  i.payments.forEach(p=>J.push({id:p.rcp||i.id+'-p',date:p.date,ref:p.rcp||i.id,memo:`Receipt from ${cust(i.cust).company}`,lines:[{acct:payAcct(p.method),dr:+p.amount,cr:0},{acct:'1100',dr:0,cr:+p.amount}],src:'receipt'}))});
 S.bills.forEach(b=>{const lines=b.lines.map(l=>({acct:l.acct,dr:+l.amount,cr:0}));if(+b.vat)lines.push({acct:'2100',dr:+b.vat,cr:0});lines.push({acct:'2000',dr:0,cr:billTotal(b)});J.push({id:b.id,date:b.date,ref:b.id,memo:`Bill — ${supplier(b.supplier).name}`,lines,src:'bill'});
  b.payments.forEach((p,k)=>J.push({id:b.id+'-'+k,date:p.date,ref:b.id,memo:`Paid ${supplier(b.supplier).name}`,lines:[{acct:'2000',dr:+p.amount,cr:0},{acct:payAcct(p.method),dr:0,cr:+p.amount}],src:'billpay'}))});
 S.expenses.forEach(e=>J.push({id:e.id,date:e.date,ref:e.id,memo:e.desc,lines:[{acct:e.acct,dr:+e.amount,cr:0},{acct:e.from,dr:0,cr:+e.amount}],src:'expense'}));
 S.movements.filter(v=>v.type==='consume'||v.type==='adjust').forEach(v=>{const it=stockItem(v.item);const amt=Math.abs(v.qty)*it.cost;if(!amt)return;const out=v.qty<0;J.push({id:v.id,date:v.date,ref:v.ref||v.id,memo:`${v.type==='consume'?'Materials used':'Stock adjustment'} — ${it.name}`,lines:out?[{acct:'5000',dr:amt,cr:0},{acct:'1200',dr:0,cr:amt}]:[{acct:'1200',dr:amt,cr:0},{acct:'5000',dr:0,cr:amt}],src:'stock'})});
 S.manualJournals.forEach(j=>J.push({...j,src:'manual'}));
 return J.sort((a,b)=>a.date<b.date?-1:1)}
function balances(from,to){const bal={};allJournals().forEach(j=>{if((from&&j.date<from)||(to&&j.date>to))return;j.lines.forEach(l=>{bal[l.acct]=(bal[l.acct]||0)+(+l.dr||0)-(+l.cr||0)})});return bal}
const natural=(a,v)=>['asset','expense'].includes(a.type)?v:-v; // positive = normal balance
function periodRange(p){const T=today(),m=T.slice(0,7);if(p==='month')return [m+'-01',T];if(p==='last'){const d=new Date(T);d.setMonth(d.getMonth()-1);const lm=d.toISOString().slice(0,7);return [lm+'-01',lm+'-31']}if(p==='ytd')return [T.slice(0,4)+'-01-01',T];return [null,T]}
let acctTab='reports',acctPeriod='month';
function printReceipt(invId,rcp){const i=S.invoices.find(x=>x.id===invId);const p=i.payments.find(x=>x.rcp===rcp);const c=cust(i.cust);closeModal();
 document.getElementById('main').innerHTML=`<div class="panel doc"><div class="head"><div><h2>${S.settings.company}</h2><div class="muted">${S.settings.cr} · ${S.settings.phone}</div></div><div style="text-align:end"><h2>${t('receiptDoc')}</h2><div>${rcp}<br>${p.date}</div></div></div>
 <table><tr><td>${t('receivedFrom')}</td><td><b>${c.name}</b> — ${c.company}</td></tr><tr><td>${t('forInvoice')}</td><td>${i.id} · ${t('total')} ${fmt(invTotal(i))}</td></tr><tr><td>${t('method')}</td><td>${t(p.method)}</td></tr><tr><td>${t('amount')}</td><td><b style="font-size:24px">${fmt(p.amount)}</b></td></tr><tr><td>${t('balance')}</td><td>${fmt(invTotal(i)-invPaid(i))}</td></tr></table><p class="muted">${t('thanks')}</p></div>`;setTimeout(()=>{window.print();render()},300)}

// ---------------------------------------------------------------- bills & expenses
VIEWS.bills=()=>{const ap=S.bills.reduce((a,b)=>a+billBal(b),0);const m=today().slice(0,7);const mexp=S.expenses.filter(e=>e.date.slice(0,7)===m).reduce((a,e)=>a+ +e.amount,0)+S.bills.filter(b=>b.date.slice(0,7)===m).reduce((a,b)=>a+b.lines.filter(l=>acct(l.acct).type==='expense').reduce((x,l)=>x+ +l.amount,0),0);
 return `<div class="topbar"><h1>${t('bills')}</h1><div class="row"><button class="btn" onclick="openExpense()">+ ${t('newExpense')}</button><button class="btn primary" onclick="openBill()">+ ${t('newBill')}</button></div></div>
 <div class="kpis"><div class="kpi" style="border-color:var(--amber)"><div class="v">${fmt(ap)}</div><div class="l">${t('ap')}</div></div><div class="kpi"><div class="v">${S.bills.filter(b=>billBal(b)>0.5&&b.due<today()).length}</div><div class="l">${t('overdue')||'Overdue'} bills</div></div><div class="kpi"><div class="v">${fmt(mexp)}</div><div class="l">${t('expenses')} · ${m}</div></div></div>
 <div class="panel"><h2>${t('newBill').replace('New ','').replace('فاتورة مورد جديدة','فواتير الموردين')}</h2><table><tr><th>${t('ref')}</th><th>${t('date')}</th><th>${t('supplierN')}</th><th>${t('memo')}</th><th>${t('dueDate')}</th><th>${t('billTotal')}</th><th>${t('balance')}</th><th>${t('status')}</th><th></th></tr>
 ${S.bills.slice().sort((a,b)=>a.date<b.date?1:-1).map(b=>{const bal=billBal(b);const st=bal<0.5?'Paid':billPaid(b)>0?'Partial':'Unpaid';return `<tr><td><b>${b.id}</b><br><span class="muted">${b.ref||''}</span></td><td class="muted">${b.date}</td><td>${supplier(b.supplier).name}</td><td>${b.lines.map(l=>l.desc).join(', ')}</td><td>${b.due}${bal>0.5&&b.due<today()?` <span class="tag overdue">${t('late')}</span>`:''}</td><td>${fmt(billTotal(b))}</td><td><b>${fmt(bal)}</b></td><td><span class="tag ${st.toLowerCase()}">${ts(st)}</span></td><td>${bal>0.5?`<button class="btn sm green" onclick="openPayBill('${b.id}')">${t('payBill')}</button>`:''}</td></tr>`}).join('')}</table></div>
 <div class="panel"><h2>${t('expenses')}</h2><table><tr><th>${t('ref')}</th><th>${t('date')}</th><th>${t('memo')}</th><th>${t('account')}</th><th>${t('paidFrom')}</th><th>${t('amount')}</th><th></th></tr>
 ${S.expenses.slice().sort((a,b)=>a.date<b.date?1:-1).map((e,i)=>`<tr><td><b>${e.id}</b></td><td class="muted">${e.date}</td><td>${e.desc}</td><td>${acct(e.acct).name}</td><td>${acct(e.from).name}</td><td><b>${fmt(e.amount)}</b></td><td><button class="btn sm ghost" onclick="S.expenses=S.expenses.filter(x=>x.id!=='${e.id}');persist();render()">×</button></td></tr>`).join('')}</table></div>`};
function acctOptions(types,sel){return S.accounts.filter(a=>types.includes(a.type)&&(!a.sub||types.includes('asset'))).map(a=>`<option value="${a.code}" ${a.code===sel?'selected':''}>${a.code} · ${a.name}</option>`).join('')}
function openBill(){modal(`<h2>${t('newBill')}</h2><div class="grid2"><label>${t('supplierN')}<select id="b_s">${S.suppliers.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}<option value="__new">+ New supplier…</option></select></label><label>${t('name')} (new supplier)<input id="b_sn"></label><label>${t('ref')}<input id="b_r" placeholder="Supplier invoice no."></label><label>${t('date')}<input type="date" id="b_d" value="${today()}"></label><label>${t('dueDate')}<input type="date" id="b_due" value="${addDays(today(),30)}"></label><label>${t('account')}<select id="b_a">${acctOptions(['expense','asset'],'6090')}</select></label><label>${t('memo')}<input id="b_m"></label><label>${t('amount')}<input type="number" id="b_amt" value="0"></label><label>${t('vat')} (QAR)<input type="number" id="b_v" value="0"></label></div>
 <div class="row"><button class="btn primary" onclick="saveBill()">${t('save')}</button><button class="btn" onclick="closeModal()">${t('cancel')}</button></div>`)}
function saveBill(){const v=k=>document.getElementById(k).value;let sp=v('b_s');if(sp==='__new'){const n=v('b_sn').trim();if(!n)return toast('Supplier name required');sp='sp'+uid();S.suppliers.push({id:sp,name:n,phone:''})}if(!+v('b_amt'))return toast('Amount required');
 S.bills.push({id:'BILL-'+(S.seq.bill++),date:v('b_d'),due:v('b_due'),supplier:sp,ref:v('b_r'),lines:[{acct:v('b_a'),desc:v('b_m'),amount:+v('b_amt')}],vat:+v('b_v'),payments:[]});persist();closeModal();render();toast('✓')}
function openPayBill(id){const b=S.bills.find(x=>x.id===id);modal(`<h2>${t('payBill')} · ${id}</h2><p>${supplier(b.supplier).name} · ${t('balance')}: <b>${fmt(billBal(b))}</b></p><div class="grid2"><label>${t('amount')}<input type="number" id="pb_a" value="${Math.round(billBal(b))}"></label><label>${t('paidFrom')}<select id="pb_m"><option value="transfer">${t('bankAcct')} (${t('transfer')})</option><option value="cash">${t('cashAcct')}</option></select></label><label>${t('date')}<input type="date" id="pb_d" value="${today()}"></label></div>
 <div class="row"><button class="btn green" onclick="S.bills.find(x=>x.id==='${id}').payments.push({date:document.getElementById('pb_d').value,amount:+document.getElementById('pb_a').value,method:document.getElementById('pb_m').value});persist();closeModal();render();toast('✓')">${t('save')}</button><button class="btn" onclick="closeModal()">${t('cancel')}</button></div>`)}
function openExpense(){modal(`<h2>${t('newExpense')}</h2><div class="grid2"><label>${t('date')}<input type="date" id="e_d" value="${today()}"></label><label>${t('expenseAcct')}<select id="e_a">${acctOptions(['expense'],'6090')}</select></label><label>${t('memo')}<input id="e_m"></label><label>${t('amount')}<input type="number" id="e_amt" value="0"></label><label>${t('paidFrom')}<select id="e_f"><option value="1000">${t('cashAcct')}</option><option value="1010">${t('bankAcct')}</option></select></label></div>
 <div class="row"><button class="btn primary" onclick="const v=k=>document.getElementById(k).value;if(!+v('e_amt'))return;S.expenses.push({id:'EXP-'+(S.seq.exp++),date:v('e_d'),acct:v('e_a'),desc:v('e_m'),amount:+v('e_amt'),from:v('e_f')});persist();closeModal();render();toast('✓')">${t('save')}</button><button class="btn" onclick="closeModal()">${t('cancel')}</button></div>`)}

// ---------------------------------------------------------------- accounting views
VIEWS.accounts=()=>{const tabs=['reports','ageing','statements','journal','chart'];
 return `<div class="topbar"><h1>${t('accounts')}</h1><div class="row">${tabs.map(x=>`<button class="btn sm ${acctTab===x?'primary':''}" onclick="acctTab='${x}';render()">${t(x)}</button>`).join('')}</div></div>${ACCT[acctTab]()}`};
const ACCT={};
function periodSel(){return `<select style="width:auto" onchange="acctPeriod=this.value;render()">${[['month','thisMonth'],['last','lastMonth'],['ytd','ytd'],['all','allTime']].map(([v,k])=>`<option value="${v}" ${acctPeriod===v?'selected':''}>${t(k)}</option>`).join('')}</select>`}
ACCT.reports=()=>{const [from,to]=periodRange(acctPeriod);const pb=balances(from,to);const cb=balances(null,to);
 const sum=(type,b)=>S.accounts.filter(a=>a.type===type).reduce((x,a)=>x+natural(a,b[a.code]||0),0);
 const inc=sum('income',pb),exp=sum('expense',pb),np=inc-exp;const incAll=sum('income',cb),expAll=sum('expense',cb);
 const rows=(type,b)=>S.accounts.filter(a=>a.type===type&&(b[a.code]||0)!==0).map(a=>`<tr><td>${a.code} · ${a.name}</td><td style="text-align:end">${fmt(natural(a,b[a.code]||0))}</td></tr>`).join('');
 const assets=sum('asset',cb),liab=sum('liability',cb),eq=sum('equity',cb)+(incAll-expAll);
 const tbRows=S.accounts.filter(a=>(cb[a.code]||0)!==0).map(a=>{const v=cb[a.code]||0;return `<tr><td>${a.code}</td><td>${a.name}</td><td class="muted">${I18N[lang].atype[a.type]}</td><td style="text-align:end">${v>0?fmt(v):''}</td><td style="text-align:end">${v<0?fmt(-v):''}</td></tr>`}).join('');
 const tdr=Object.values(cb).filter(v=>v>0).reduce((a,v)=>a+v,0),tcr=-Object.values(cb).filter(v=>v<0).reduce((a,v)=>a+v,0);
 const vatOut=allJournals().filter(j=>j.src==='invoice'&&(!from||j.date>=from)&&j.date<=to).reduce((a,j)=>a+j.lines.filter(l=>l.acct==='2100').reduce((x,l)=>x+ +l.cr,0),0),vatIn=allJournals().filter(j=>j.src==='bill'&&(!from||j.date>=from)&&j.date<=to).reduce((a,j)=>a+j.lines.filter(l=>l.acct==='2100').reduce((x,l)=>x+ +l.dr,0),0);
 return `<div class="row"><span class="muted">${t('period')}:</span>${periodSel()}<span class="muted">${from||'—'} → ${to}</span></div>
 <div class="kpis"><div class="kpi" style="border-color:var(--green)"><div class="v">${fmt(inc)}</div><div class="l">${t('income')}</div></div><div class="kpi" style="border-color:var(--amber)"><div class="v">${fmt(exp)}</div><div class="l">${t('expenses')}</div></div><div class="kpi" style="border-color:${np>=0?'var(--green)':'var(--accent)'}"><div class="v">${fmt(np)}</div><div class="l">${t('netProfit')} · ${inc?Math.round(np/inc*100):0}%</div></div><div class="kpi"><div class="v">${fmt((cb['1000']||0)+(cb['1010']||0))}</div><div class="l">${t('cashbank')} · ${t('bankBal')}</div></div><div class="kpi" style="border-color:var(--blue)"><div class="v">${fmt(cb['1100']||0)}</div><div class="l">${t('ar')}</div></div><div class="kpi" style="border-color:var(--amber)"><div class="v">${fmt(-(cb['2000']||0))}</div><div class="l">${t('ap')}</div></div></div>
 <div class="two"><div class="panel"><h2>${t('pnl')}</h2><table><tr><th colspan=2>${t('income')}</th></tr>${rows('income',pb)}<tr><td><b>${t('income')}</b></td><td style="text-align:end"><b>${fmt(inc)}</b></td></tr><tr><th colspan=2>${t('expenses')}</th></tr>${rows('expense',pb)}<tr><td><b>${t('expenses')}</b></td><td style="text-align:end"><b>${fmt(exp)}</b></td></tr><tr style="background:${np>=0?'#DCEFE2':'#F9DCDA'}"><td><b>${t('netProfit')}</b></td><td style="text-align:end"><b>${fmt(np)}</b></td></tr></table>
  <h2 style="margin-top:18px">${t('vatRep')}</h2><table><tr><td>${t('vatOut')}</td><td style="text-align:end">${fmt(vatOut)}</td></tr><tr><td>${t('vatIn')}</td><td style="text-align:end">${fmt(vatIn)}</td></tr><tr><td><b>${t('vatNet')}</b></td><td style="text-align:end"><b>${fmt(vatOut-vatIn)}</b></td></tr></table><p class="muted">VAT rate in Settings is ${S.settings.vat}% (Qatar has no VAT on these services today; the ledger is ready for it).</p></div>
 <div class="panel"><h2>${t('bs')} · ${to}</h2><table><tr><th colspan=2>${t('assets')}</th></tr>${rows('asset',cb)}<tr><td><b>${t('assets')}</b></td><td style="text-align:end"><b>${fmt(assets)}</b></td></tr><tr><th colspan=2>${t('liabilities')}</th></tr>${rows('liability',cb)}<tr><td><b>${t('liabilities')}</b></td><td style="text-align:end"><b>${fmt(liab)}</b></td></tr><tr><th colspan=2>${t('equity')}</th></tr>${rows('equity',cb)}<tr><td>${t('netProfit')} (${t('allTime').toLowerCase()})</td><td style="text-align:end">${fmt(incAll-expAll)}</td></tr><tr><td><b>${t('equity')}</b></td><td style="text-align:end"><b>${fmt(eq)}</b></td></tr><tr style="background:#f3f2ee"><td><b>${t('liabilities')} + ${t('equity')}</b></td><td style="text-align:end"><b>${fmt(liab+eq)}</b></td></tr></table></div></div>
 <div class="panel"><h2>${t('tb')} · ${to}</h2><table><tr><th>${t('code')}</th><th>${t('account')}</th><th>${t('typeA')}</th><th style="text-align:end">${t('debit')}</th><th style="text-align:end">${t('credit')}</th></tr>${tbRows}<tr style="background:#f3f2ee"><td colspan=3><b>${t('total')}</b></td><td style="text-align:end"><b>${fmt(tdr)}</b></td><td style="text-align:end"><b>${fmt(tcr)}</b></td></tr></table></div>`};
function ageBuckets(items){const T=today();const b={cur:0,d30:0,d60:0,d90:0,d90p:0};items.forEach(([date,amt])=>{const d=Math.round((new Date(T)-new Date(date))/86400000);if(d<=0)b.cur+=amt;else if(d<=30)b.d30+=amt;else if(d<=60)b.d60+=amt;else if(d<=90)b.d90+=amt;else b.d90p+=amt});return b}
ACCT.ageing=()=>{const arRows=S.customers.map(c=>{const inv=S.invoices.filter(i=>i.cust===c.id&&invTotal(i)-invPaid(i)>0.5);if(!inv.length)return null;const b=ageBuckets(inv.map(i=>[i.date,invTotal(i)-invPaid(i)]));return {n:c.company,b,tot:Object.values(b).reduce((a,v)=>a+v,0),ph:c.phone}}).filter(Boolean);
 const apRows=S.suppliers.map(sp=>{const bs=S.bills.filter(b=>b.supplier===sp.id&&billBal(b)>0.5);if(!bs.length)return null;const b=ageBuckets(bs.map(x=>[x.due,billBal(x)]));return {n:sp.name,b,tot:Object.values(b).reduce((a,v)=>a+v,0)}}).filter(Boolean);
 const tbl=(rows,title)=>`<div class="panel"><h2>${title}</h2><table><tr><th>${t('name')}</th><th style="text-align:end">${t('current')}</th><th style="text-align:end">${t('d30')}</th><th style="text-align:end">${t('d60')}</th><th style="text-align:end">${t('d90')}</th><th style="text-align:end">${t('d90p')}</th><th style="text-align:end">${t('outstanding')}</th></tr>${rows.map(r=>`<tr><td><b>${r.n}</b></td>${['cur','d30','d60','d90','d90p'].map(k=>`<td style="text-align:end;${k!=='cur'&&r.b[k]?'color:var(--accent)':''}">${r.b[k]?fmt(r.b[k]):''}</td>`).join('')}<td style="text-align:end"><b>${fmt(r.tot)}</b></td></tr>`).join('')||`<tr><td colspan=7 class="muted">${t('noData')}</td></tr>`}<tr style="background:#f3f2ee"><td><b>${t('total')}</b></td>${['cur','d30','d60','d90','d90p'].map(k=>`<td style="text-align:end">${fmt(rows.reduce((a,r)=>a+r.b[k],0))}</td>`).join('')}<td style="text-align:end"><b>${fmt(rows.reduce((a,r)=>a+r.tot,0))}</b></td></tr></table></div>`;
 return tbl(arRows,t('ar'))+tbl(apRows,t('ap'))};
let stmtCust=null;
ACCT.statements=()=>{const c=S.customers.find(x=>x.id===stmtCust)||S.customers[0];const rows=[];S.invoices.filter(i=>i.cust===c.id).forEach(i=>{rows.push({d:i.date,ref:i.id,memo:`Invoice — ${(S.jobs.find(j=>j.id===i.job)||{}).title||''}`,dr:invTotal(i),cr:0});i.payments.forEach(p=>rows.push({d:p.date,ref:p.rcp||'',memo:`Receipt (${t(p.method)})`,dr:0,cr:+p.amount}))});rows.sort((a,b)=>a.d<b.d?-1:1);let run=0;
 return `<div class="row"><label style="width:360px">${t('statementFor')}<select onchange="stmtCust=this.value;render()">${S.customers.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${x.name} — ${x.company}</option>`).join('')}</select></label><button class="btn ghost" style="align-self:end" onclick="window.print()">${t('printStmt')}</button></div>
 <div class="panel doc"><div class="head"><div><h2>${S.settings.company}</h2><div class="muted">${S.settings.cr} · ${S.settings.phone}</div></div><div style="text-align:end"><h2>${t('statementFor')}</h2><div>${c.company}<br>${c.name} · ${c.phone}<br>${today()}</div></div></div>
 <table><tr><th>${t('date')}</th><th>${t('ref')}</th><th>${t('memo')}</th><th style="text-align:end">${t('debit')}</th><th style="text-align:end">${t('credit')}</th><th style="text-align:end">${t('balance')}</th></tr>${rows.map(r=>{run+=r.dr-r.cr;return `<tr><td>${r.d}</td><td>${r.ref}</td><td>${r.memo}</td><td style="text-align:end">${r.dr?fmt(r.dr):''}</td><td style="text-align:end">${r.cr?fmt(r.cr):''}</td><td style="text-align:end">${fmt(run)}</td></tr>`}).join('')||`<tr><td colspan=6 class="muted">${t('noData')}</td></tr>`}<tr style="background:#f3f2ee"><td colspan=5><b>${t('closing')}</b></td><td style="text-align:end"><b>${fmt(run)}</b></td></tr></table></div>`};
ACCT.journal=()=>{const J=allJournals().slice().reverse();return `<div class="row"><button class="btn primary" onclick="openJE()">+ ${t('manualJE')}</button><span class="muted">${J.length} entries · ledger is built from invoices, receipts, bills, expenses and stock movements; manual entries are stored.</span></div>
 <div class="panel"><table><tr><th>${t('date')}</th><th>${t('ref')}</th><th>${t('memo')}</th><th>${t('account')}</th><th style="text-align:end">${t('debit')}</th><th style="text-align:end">${t('credit')}</th></tr>${J.slice(0,120).map(j=>j.lines.map((l,k)=>`<tr>${k===0?`<td rowspan="${j.lines.length}" class="muted">${j.date}</td><td rowspan="${j.lines.length}"><b>${j.ref}</b><br><span class="tag draft">${j.src||'opening'}</span></td><td rowspan="${j.lines.length}">${j.memo}</td>`:''}<td style="${l.cr?'padding-inline-start:36px':''}">${l.acct} · ${acct(l.acct).name}</td><td style="text-align:end">${l.dr?fmt(l.dr):''}</td><td style="text-align:end">${l.cr?fmt(l.cr):''}</td></tr>`).join('')).join('')}</table></div>`};
let JE=null;
function openJE(){JE={date:today(),memo:'',lines:[{acct:'6090',dr:0,cr:0},{acct:'1010',dr:0,cr:0}]};renderJE()}
function renderJE(){const dr=JE.lines.reduce((a,l)=>a+ +l.dr,0),cr=JE.lines.reduce((a,l)=>a+ +l.cr,0);
 modal(`<h2>${t('manualJE')}</h2><div class="grid2"><label>${t('date')}<input type="date" value="${JE.date}" onchange="JE.date=this.value"></label><label>${t('memo')}<input value="${esc(JE.memo)}" oninput="JE.memo=this.value"></label></div>
 <table><tr><th>${t('account')}</th><th>${t('debit')}</th><th>${t('credit')}</th><th></th></tr>${JE.lines.map((l,i)=>`<tr><td><select onchange="JE.lines[${i}].acct=this.value">${acctOptions(['asset','liability','equity','income','expense'],l.acct)}</select></td><td><input type="number" value="${l.dr}" onchange="JE.lines[${i}].dr=+this.value;renderJE()"></td><td><input type="number" value="${l.cr}" onchange="JE.lines[${i}].cr=+this.value;renderJE()"></td><td><button class="btn sm ghost" onclick="JE.lines.splice(${i},1);renderJE()">×</button></td></tr>`).join('')}<tr><td><b>${t('total')}</b></td><td><b>${fmt(dr)}</b></td><td><b>${fmt(cr)}</b></td><td></td></tr></table>
 <div class="row"><button class="btn sm" onclick="JE.lines.push({acct:'6090',dr:0,cr:0});renderJE()">+ ${t('addLineJ')}</button>${Math.abs(dr-cr)>0.005?`<span class="tag overdue">${t('balanceCheck')}</span>`:''}<button class="btn primary right" ${Math.abs(dr-cr)>0.005||!dr?'disabled':''} onclick="S.manualJournals.push({id:'JE-'+(S.seq.je++),date:JE.date,ref:'JE-'+(S.seq.je-1),memo:JE.memo,lines:JE.lines.filter(l=>l.dr||l.cr)});persist();closeModal();render();toast('✓')">${t('save')}</button><button class="btn" onclick="closeModal()">${t('cancel')}</button></div>`)}
ACCT.chart=()=>{const cb=balances(null,today());return `<div class="panel"><table><tr><th>${t('code')}</th><th>${t('account')}</th><th>${t('typeA')}</th><th style="text-align:end">${t('balance')}</th></tr>${S.accounts.map((a,i)=>`<tr><td><b>${a.code}</b></td><td><input value="${esc(a.name)}" onchange="S.accounts[${i}].name=this.value;persist()"></td><td><span class="tag">${I18N[lang].atype[a.type]}</span></td><td style="text-align:end">${fmt(natural(a,cb[a.code]||0))}</td></tr>`).join('')}</table>
 <div class="row" style="margin-top:12px"><input id="na_code" placeholder="6070" style="width:100px"><input id="na_name" placeholder="Account name" style="width:260px"><select id="na_type" style="width:auto">${['asset','liability','equity','income','expense'].map(x=>`<option value="${x}">${I18N[lang].atype[x]}</option>`).join('')}</select><button class="btn sm" onclick="const c=document.getElementById('na_code').value.trim();if(!c||S.accounts.find(a=>a.code===c))return toast('Code exists');S.accounts.push({code:c,name:document.getElementById('na_name').value,type:document.getElementById('na_type').value});S.accounts.sort((a,b)=>a.code<b.code?-1:1);persist();render()">+ ${t('account')}</button></div></div>`};

// ---------------------------------------------------------------- customers
VIEWS.customers=()=>`<div class="topbar"><h1>${t('customers')}</h1><button class="btn primary" onclick="openEnquiry()">+ ${t('newEnq')}</button></div><div class="panel"><table><tr><th>${t('name')}</th><th>${t('company')}</th><th>${t('phone')}</th><th>${t('source')}</th><th>${t('jobsCount')}</th><th>${t('spent')}</th></tr>
 ${S.customers.map(c=>{const js=S.jobs.filter(j=>j.cust===c.id);return `<tr><td><b>${c.name}</b></td><td>${c.company}</td><td>${c.phone}</td><td>${srcName(c.source)}</td><td>${js.length}</td><td>${fmt(js.reduce((a,j)=>a+jobQuoteTotal(j),0))}</td></tr>`}).join('')}</table></div>`;

// ---------------------------------------------------------------- settings
VIEWS.settings=()=>`<div class="topbar"><h1>${t('settings')}</h1><button class="btn ghost" onclick="if(confirm('Reset demo data?')){S=seed();persist();render()}">Reset demo data</button></div>
 <div class="two"><div class="panel"><h2>${t('companyName')}</h2><div class="grid2">
  <label>${t('companyName')}<input value="${esc(S.settings.company)}" onchange="S.settings.company=this.value;persist()"></label><label>C.R.<input value="${esc(S.settings.cr)}" onchange="S.settings.cr=this.value;persist()"></label>
  <label>${t('phone')}<input value="${esc(S.settings.phone)}" onchange="S.settings.phone=this.value;persist()"></label><label>${t('vatRate')}<input type="number" value="${S.settings.vat}" onchange="S.settings.vat=+this.value;persist()"></label>
  <label>${t('labourRate')}<input type="number" value="${S.settings.labour}" onchange="S.settings.labour=+this.value;persist()"></label></div>
  <h2 style="margin-top:18px">${t('machines')}</h2><div class="grid2">${Object.keys(S.machines).map(m=>`<label>${m} (QAR/h)<input type="number" value="${S.machines[m]}" onchange="S.machines['${m}']=+this.value;persist()"></label>`).join('')}</div></div>
 <div class="panel"><h2>${t('materials')}</h2><table><tr><th>${t('material')}</th><th>${t('unit')}</th><th>${t('ratePer')}</th><th>${t('machine')}</th><th></th></tr>
  ${S.materials.map((m,i)=>`<tr><td><input value="${esc(m.name)}" onchange="S.materials[${i}].name=this.value;persist()"></td><td><select onchange="S.materials[${i}].unit=this.value;persist()">${['sqm','piece','hour','lm'].map(u=>`<option ${m.unit===u?'selected':''}>${u}</option>`).join('')}</select></td><td><input type="number" value="${m.rate}" onchange="S.materials[${i}].rate=+this.value;persist()"></td><td><select onchange="S.materials[${i}].machine=this.value;persist()">${Object.keys(S.machines).map(x=>`<option ${m.machine===x?'selected':''}>${x}</option>`).join('')}</select></td><td><button class="btn sm ghost" onclick="S.materials.splice(${i},1);persist();render()">×</button></td></tr>`).join('')}</table>
  <button class="btn sm" style="margin-top:10px" onclick="S.materials.push({id:'m'+uid(),name:'New material',unit:'sqm',rate:100,machine:'Digital print'});persist();render()">+ ${t('addMat')}</button></div></div>`;

// ---------------------------------------------------------------- utils
function modal(h){document.getElementById('modal').innerHTML=h;document.getElementById('modalbg').classList.add('open')}
function closeModal(){document.getElementById('modalbg').classList.remove('open')}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
render();
</script>
</body>
</html>
